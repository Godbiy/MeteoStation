<div id="confirm-modal" class="cfm" hidden>
  <div class="cfm-box">
    <div class="cfm-msg" id="cfm-msg"></div>
    <div class="cfm-actions">
      <button class="btn" id="cfm-no" data-i18n="cancel">Cancel</button>
      <button class="btn danger" id="cfm-yes" data-i18n="confirm_yes">Yes</button>
    </div>
  </div>
</div>
<div id="sync-modal" class="cfm" hidden>
  <div class="cfm-box sync-box">
    <div class="sync-title" data-i18n="sync_title">Cache sync</div>
    <ul class="sync-steps" id="sync-steps">
      <li data-step="check"><span class="si">📡</span> <span data-i18n="sync_check">Checking server</span></li>
      <li data-step="download"><span class="si">⬇️</span> <span data-i18n="sync_download">Downloading</span></li>
      <li data-step="write"><span class="si">💾</span> <span data-i18n="sync_write">Writing to cache</span></li>
      <li data-step="trim"><span class="si">🗑️</span> <span data-i18n="sync_trim">Trimming</span></li>
      <li data-step="done"><span class="si">✅</span> <span data-i18n="sync_done">Done</span></li>
    </ul>
    <div class="sync-bar"><div class="sync-bar-fill" id="sync-fill"></div></div>
    <div class="sync-count" id="sync-count">—</div>
    <div class="cfm-actions"><button class="btn" id="sync-close" data-i18n="sync_close" hidden>Close</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<button id="zoom-reset-all" class="zoom-reset-all">⊙ reset zoom</button>

<script defer src="?asset=dashboard.js"></script>
</body>
</html>
